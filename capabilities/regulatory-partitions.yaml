naftiko: 1.0.0-alpha2
info:
  label: FINRA Developer Center API — Partitions
  description: 'FINRA Developer Center API — Partitions. 1 operations. Lead operation: List dataset partitions. Self-contained
    Naftiko capability covering one Regulatory business surface.'
  tags:
  - Regulatory
  - Partitions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    REGULATORY_API_KEY: REGULATORY_API_KEY
capability:
  consumes:
  - type: http
    namespace: regulatory-partitions
    baseUri: https://api.finra.org
    description: FINRA Developer Center API — Partitions business capability. Self-contained, no shared references.
    resources:
    - name: partitions-group-group-name-dataset
      path: /partitions/group/{group}/name/{dataset}
      operations:
      - name: listdatasetpartitions
        method: GET
        description: List dataset partitions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.REGULATORY_API_KEY}}'
  exposes:
  - type: rest
    namespace: regulatory-partitions-rest
    port: 8080
    description: REST adapter for FINRA Developer Center API — Partitions. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/partitions/group/{group}/name/{dataset}
      name: partitions-group-group-name-dataset
      description: REST surface for partitions-group-group-name-dataset.
      operations:
      - method: GET
        name: listdatasetpartitions
        description: List dataset partitions
        call: regulatory-partitions.listdatasetpartitions
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: regulatory-partitions-mcp
    port: 9090
    transport: http
    description: MCP adapter for FINRA Developer Center API — Partitions. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-dataset-partitions
      description: List dataset partitions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: regulatory-partitions.listdatasetpartitions
      outputParameters:
      - type: object
        mapping: $.
