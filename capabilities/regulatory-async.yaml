naftiko: 1.0.0-alpha2
info:
  label: FINRA Developer Center API — Async
  description: 'FINRA Developer Center API — Async. 1 operations. Lead operation: Get async request status. Self-contained
    Naftiko capability covering one Regulatory business surface.'
  tags:
  - Regulatory
  - Async
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    REGULATORY_API_KEY: REGULATORY_API_KEY
capability:
  consumes:
  - type: http
    namespace: regulatory-async
    baseUri: https://api.finra.org
    description: FINRA Developer Center API — Async business capability. Self-contained, no shared references.
    resources:
    - name: async-requests-group-group-name-dataset-requestId
      path: /async-requests/group/{group}/name/{dataset}/{requestId}
      operations:
      - name: getasyncrequeststatus
        method: GET
        description: Get async request status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: requestId
          in: path
          type: string
          description: Asynchronous request identifier.
          required: true
    authentication:
      type: bearer
      token: '{{env.REGULATORY_API_KEY}}'
  exposes:
  - type: rest
    namespace: regulatory-async-rest
    port: 8080
    description: REST adapter for FINRA Developer Center API — Async. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/async-requests/group/{group}/name/{dataset}/{requestid}
      name: async-requests-group-group-name-dataset-requestid
      description: REST surface for async-requests-group-group-name-dataset-requestId.
      operations:
      - method: GET
        name: getasyncrequeststatus
        description: Get async request status
        call: regulatory-async.getasyncrequeststatus
        with:
          requestId: rest.requestId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: regulatory-async-mcp
    port: 9090
    transport: http
    description: MCP adapter for FINRA Developer Center API — Async. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-async-request-status
      description: Get async request status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: regulatory-async.getasyncrequeststatus
      with:
        requestId: tools.requestId
      outputParameters:
      - type: object
        mapping: $.
